<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="weather-container">

        <h1>Weather Dashboard</h1>

        <p class="subtitle">
            Check the current weather of any city
        </p>

        <!-- Search Form -->

        <form id="weatherForm">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
                required
            >

            <button type="submit">
                Search
            </button>

        </form>


        <!-- Loading Message -->

        <p id="loading" class="hidden">
            Loading weather data...
        </p>


        <!-- Error Message -->

        <p id="error" class="error"></p>


        <!-- Weather Result -->

        <section
            id="weatherCard"
            class="weather-card hidden"
        >

            <h2 id="cityName">
                City
            </h2>

            <div class="temperature">
                <span id="temperature">--</span>°C
            </div>

            <p id="condition">
                Weather condition
            </p>

            <div class="weather-details">

                <div>
                    <strong>Wind</strong>
                    <span id="wind">--</span>
                </div>

                <div>
                    <strong>Humidity</strong>
                    <span id="humidity">--</span>
                </div>

                <div>
                    <strong>Coordinates</strong>
                    <span id="coordinates">--</span>
                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
